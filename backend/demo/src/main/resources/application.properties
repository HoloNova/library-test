spring.application.name=library-system

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=library-management-system-secret-key-2024-very-long-secret
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500

borrow.default-days=30
