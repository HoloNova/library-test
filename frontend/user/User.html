<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 用户</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="card login-card">
            <h1 class="login-title">图书管理系统</h1>
            <div class="form-group">
                <label class="form-label">学号</label>
                <input type="text" id="loginStudyID" class="input" placeholder="请输入学号">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="loginPassword" class="input" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="userLogin()">登录</button>
            <div style="margin-top: 16px; text-align: center; font-size: 14px; color: #666;">
                测试账号：学号 123 / 密码 123
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">图书管理系统</div>
                    <div class="nav">
                        <div class="nav-item active" onclick="switchTab('search')">检索书库</div>
                        <div class="nav-item" onclick="switchTab('borrow')">借阅</div>
                        <div class="nav-item" onclick="userLogout()">退出</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <div id="overdueAlert" class="alert alert-danger hidden">
                    您有逾期未还的图书，请尽快归还！
                </div>

                <div id="searchTab">
                    <div class="card">
                        <div class="form-group">
                            <input type="text" id="searchInput" class="input" placeholder="搜索书名、ISBN、出版社...">
                        </div>
                        <div id="categoryTags">
                            <span class="tag active" onclick="filterByCategory('all')">全部</span>
                            <span class="tag" onclick="filterByCategory('文学')">文学</span>
                            <span class="tag" onclick="filterByCategory('科技')">科技</span>
                            <span class="tag" onclick="filterByCategory('历史')">历史</span>
                            <span class="tag" onclick="filterByCategory('艺术')">艺术</span>
                            <span class="tag" onclick="filterByCategory('哲学')">哲学</span>
                        </div>
                    </div>

                    <div id="recommendSection">
                        <h3 class="section-title">推荐图书</h3>
                        <div id="recommendBooks" class="grid grid-4"></div>
                    </div>

                    <h3 class="section-title" style="margin-top: 40px;">图书列表</h3>
                    <div id="bookList" class="grid grid-4"></div>
                </div>

                <div id="borrowTab" class="hidden">
                    <h3 class="section-title">当前借阅</h3>
                    <div id="currentBorrows" class="card">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>书名</th>
                                    <th>出版社</th>
                                    <th>到期时间</th>
                                    <th>距今</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="currentBorrowsBody"></tbody>
                        </table>
                    </div>

                    <h3 class="section-title" style="margin-top: 40px;">历史借阅</h3>
                    <div id="historyBorrows" class="card">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>书名</th>
                                    <th>出版社</th>
                                    <th>借阅时间</th>
                                    <th>归还时间</th>
                                </tr>
                            </thead>
                            <tbody id="historyBorrowsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/user.js"></script>
</body>
</html>
